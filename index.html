<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Analisador Rabisco</title>
    <style>
        :root {
            --fundo: #f6f5f1;
            --papel: #ffffff;
            --tinta: #1f2328;
            --suave: #6b6f76;
            --linha: #dcdad3;
            --destaque: #2f5d8a;
            --ok: #1f7a4d;
            --ok-fundo: #e6f4ec;
            --erro: #b42318;
            --erro-fundo: #fdecea;
        }

        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--fundo);
            color: var(--tinta);
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 16px 48px;
        }

        h1 { margin: 0 0 4px; font-size: 26px; }
        .sub { margin: 0 0 20px; color: var(--suave); }
        h2 { font-size: 16px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); }

        .barra {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin: 10px 0 20px;
        }

        textarea {
            width: 100%;
            height: 260px;
            font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
            font-size: 15px;
            line-height: 1.45;
            padding: 12px;
            border: 1px solid var(--linha);
            border-radius: 8px;
            background: var(--papel);
            color: var(--tinta);
            resize: vertical;
        }

        button, select {
            font: inherit;
            font-size: 15px;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--linha);
            background: var(--papel);
            color: var(--tinta);
        }

        button {
            background: var(--destaque);
            border-color: var(--destaque);
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover { filter: brightness(1.1); }
        .atalho { color: var(--suave); font-size: 13px; }

        .colunas {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) 2fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 760px) {
            .colunas { grid-template-columns: 1fr; }
        }

        .painel {
            background: var(--papel);
            border: 1px solid var(--linha);
            border-radius: 8px;
            padding: 14px;
            min-width: 0;
        }

        .rolagem { max-height: 520px; overflow: auto; }

        table { border-collapse: collapse; width: 100%; font-size: 14px; }
        th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--linha); }
        th { position: sticky; top: 0; background: var(--papel); }
        td.mono, .mono { font-family: ui-monospace, Consolas, monospace; }
        td.num { text-align: right; color: var(--suave); }

        .status {
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 12px;
            white-space: pre-wrap;
            font-family: ui-monospace, Consolas, monospace;
            font-size: 14px;
        }

        .status.ok { background: var(--ok-fundo); color: var(--ok); }
        .status.erro { background: var(--erro-fundo); color: var(--erro); }

        pre {
            margin: 0;
            font-size: 13px;
            line-height: 1.4;
            white-space: pre;
            overflow: auto;
        }

        .abas { display: flex; gap: 6px; margin-bottom: 10px; }
        .abas[hidden] { display: none; }
        .aba { background: var(--papel); color: var(--tinta); font-weight: 500; padding: 5px 12px; }
        .aba.ativa { background: var(--tinta); border-color: var(--tinta); color: #fff; }
        .vazio { color: var(--suave); font-style: italic; }
    </style>
</head>

<body>
    <h1>Analisador Rabisco</h1>
    <p class="sub">Fase 1: análise léxica, análise sintática e AST de uma linguagem para desenhar.</p>

    <textarea id="entrada" spellcheck="false"></textarea>

    <div class="barra">
        <button id="botao">Analisar</button>
        <select id="casos">
            <option value="">Carregar caso de teste…</option>
        </select>
        <span class="atalho">Ctrl + Enter também analisa</span>
    </div>

    <div class="colunas">
        <section class="painel">
            <h2>Tokens</h2>
            <div class="rolagem" id="tokens"><p class="vazio">Clique em Analisar.</p></div>
        </section>

        <section class="painel">
            <h2>Resultado</h2>
            <div id="status"></div>
            <div class="abas" id="abas" hidden>
                <button class="aba ativa" data-aba="json">AST em JSON</button>
                <button class="aba" data-aba="arvore">Árvore</button>
            </div>
            <div class="rolagem"><pre id="saida"></pre></div>
        </section>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
